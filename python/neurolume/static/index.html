<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Neurolume</title>
    <style>
      body { margin: 0; background: #06104a; color: #fff; font: 16px system-ui, sans-serif; }
      #app { display: flex; justify-content: space-evenly; align-items: center; min-height: 100vh; }
      .column { display: flex; flex-direction: column; align-items: center; gap: 14px; }
      .column h2 { font-size: 1rem; font-weight: 500; }
      .node { width: 18px; height: 18px; border-radius: 50%; background: #ddd; box-shadow: 0 0 16px #a24dff; }
    </style>
  </head>
  <body>
    <main id="app"></main>
    <script>
      fetch("/api/graph").then((response) => response.json()).then((graph) => {
        const app = document.querySelector("#app");
        graph.nodes.forEach((node) => {
          const column = document.createElement("section");
          column.className = "column";
          column.innerHTML = `<h2>${node.label}</h2>`;
          for (let i = 0; i < Math.min(node.output_shape[0] || 2, 4); i += 1) {
            const dot = document.createElement("span");
            dot.className = "node";
            column.append(dot);
          }
          app.append(column);
        });
      });
    </script>
  </body>
</html>
