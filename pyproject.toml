[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "neurolume"
version = "0.1.0"
description = "Interactive neural network architecture visualisation."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "numpy>=1.24",
    "pydantic>=2.5",
    "uvicorn>=0.29",
]

[project.optional-dependencies]
torch = ["torch>=2.0"]
tensorflow = ["tensorflow>=2.15"]
keras = ["keras>=3.0"]  # Keras 3 runs on PyTorch too: set KERAS_BACKEND=torch
dev = ["pytest>=8.0", "httpx>=0.27"]

[project.scripts]
neurolume-demo = "neurolume:show_demo"

[tool.setuptools]
package-dir = {"" = "python"}

[tool.setuptools.packages.find]
where = ["python"]

[tool.setuptools.package-data]
neurolume = ["py.typed", "static/**/*"]

[tool.pytest.ini_options]
pythonpath = ["python"]
testpaths = ["tests"]
