[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "neurolume"
version = "0.1.0"
description = "Interactive neural network architecture visualisation."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pydantic>=2.5",
    "tornado>=6.4",
]

[project.optional-dependencies]
torch = ["torch>=2.0"]
tensorflow = ["tensorflow>=2.15"]
keras = ["keras>=3.0"]  # Keras 3 runs on PyTorch too: set KERAS_BACKEND=torch
# The Qt widget (neurolume.qt) also needs a binding with QtWebEngine: PySide6, or PyQt6 + PyQt6-WebEngine.
qt = ["qtpy>=2.4"]
dev = ["pytest>=8.0"]
examples = ["torchvision>=0.17"]  # examples/resnet.py; its test skips without it

[project.scripts]
neurolume-demo = "neurolume:show_demo"

[tool.setuptools]
package-dir = {"" = "python"}

[tool.setuptools.packages.find]
where = ["python"]

[tool.setuptools.package-data]
neurolume = ["py.typed", "static/**/*"]

[tool.pytest.ini_options]
pythonpath = ["python"]
testpaths = ["tests"]
